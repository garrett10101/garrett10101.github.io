name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["redesign/portfolio-v2"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Overwrites js/emailjsConfig.js in this runner's working directory only —
      # never committed back to git. The checked-in file keeps safe REPLACE_ME
      # placeholders; see README.md "Contact form (EmailJS) setup".
      - name: Inject EmailJS config from repository secrets
        env:
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
        run: node scripts/generate-emailjs-config.js

      # node_modules is only needed for the `npm test` step above — it must
      # never be part of the published site (hundreds of unnecessary files).
      - name: Remove dev dependencies before publishing
        run: rm -rf node_modules

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
